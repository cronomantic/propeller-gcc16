# Build propgcc-16 on Linux and Windows (MSYS2 UCRT64), run tests/run.sh
# (the hub-memory builds in emu/'s Propeller emulator), and keep the
# installed toolchains as artifacts.  A tag v* publishes them as a release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write                   # the release on tags

env:
  GCC_VERSION: 16.2.0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev

      - name: GCC tarball cache
        uses: actions/cache@v6
        with:
          path: work/gcc-${{ env.GCC_VERSION }}.tar.xz
          key: gcc-${{ env.GCC_VERSION }}

      - name: Build
        run: PREFIX=$RUNNER_TEMP/propgcc-16 JOBS=$(nproc) ./build.sh

      - name: Emulator
        run: make -C emu all test

      - name: Test
        run: PATH=$RUNNER_TEMP/propgcc-16/bin:$PATH P1RUN=emu/build/p1run tests/run.sh

      - name: Package
        run: tar -C "$RUNNER_TEMP" -cJf propgcc-16-linux-x86_64.tar.xz propgcc-16

      - uses: actions/upload-artifact@v7
        with:
          name: propgcc-16-linux-x86_64
          path: propgcc-16-linux-x86_64.tar.xz

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-linux
          path: work/logs

  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No CRLF conversion (configure scripts, patches)
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make flex bison texinfo patch tar xz diffutils curl zip
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-mpc

      - name: GCC tarball cache
        uses: actions/cache@v6
        with:
          path: work/gcc-${{ env.GCC_VERSION }}.tar.xz
          key: gcc-${{ env.GCC_VERSION }}

      - name: Build
        run: PREFIX=/c/propgcc-16 JOBS=$(nproc) ./build.sh

      - name: Emulator
        run: make -C emu all test

      - name: Test
        run: PATH=/c/propgcc-16/bin:$PATH P1RUN=emu/build/p1run.exe tests/run.sh

      - name: Package
        run: |
          # the UCRT64 runtime DLLs the tools need, next to them
          for exe in /c/propgcc-16/bin/*.exe /c/propgcc-16/libexec/gcc/propeller-elf/*/*.exe; do
            ldd "$exe" 2>/dev/null | awk '/ucrt64/ {print $3}'
          done | sort -u | while read -r dll; do
            cp -n "$dll" /c/propgcc-16/bin/
            cp -n "$dll" /c/propgcc-16/libexec/gcc/propeller-elf/*/ 2>/dev/null || true
          done
          cd /c && zip -qr "$GITHUB_WORKSPACE/propgcc-16-windows-x86_64.zip" propgcc-16 ||
            powershell -NoProfile -Command "Compress-Archive -Path C:\propgcc-16 -DestinationPath '${{ github.workspace }}\propgcc-16-windows-x86_64.zip'"

      - uses: actions/upload-artifact@v7
        with:
          name: propgcc-16-windows-x86_64
          path: propgcc-16-windows-x86_64.zip

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-windows
          path: work/logs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
